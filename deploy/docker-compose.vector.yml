# 与基础 Compose 合并，统一归入 deploy；只发布宿主机回环地址。
services:
  course-vector-pg:
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:a97d77306ff47cc1d8add4d000cec2207da2e110746318df3137ce53c337ca30
    restart: unless-stopped
    environment:
      POSTGRES_DB: learnhub_vector
      POSTGRES_PASSWORD: ${LEARNHUB_VECTOR_ADMIN_PASSWORD:?请填写独立课程向量库管理员密码}
      LEARNHUB_VECTOR_USERNAME: ${LEARNHUB_VECTOR_USERNAME:-learnhub_vector_app}
      LEARNHUB_VECTOR_PASSWORD: ${LEARNHUB_VECTOR_PASSWORD:?请填写课程向量库运行账号密码}
    ports: ['127.0.0.1:15432:5432']
    volumes:
      - course-vector-data:/var/lib/postgresql/data
      - ./init-course-vector.sh:/docker-entrypoint-initdb.d/10-course-vector.sh:ro
      - ../sql/postgres/001_course_embeddings.sql:/bootstrap/001_course_embeddings.sql:ro
    networks: [vector-private]
    healthcheck:
      test: [CMD-SHELL, "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U postgres -d learnhub_vector -tAc \"SELECT to_regclass('learnhub_rag.course_embeddings_bge_zh_v1') IS NOT NULL AND EXISTS(SELECT 1 FROM pg_extension WHERE extname='vector')\" | grep -qx t"]
      interval: 5s
      timeout: 3s
      retries: 24
    mem_limit: 768m
    cpus: 2

networks:
  vector-private: {internal: true}

volumes:
  course-vector-data: {}
