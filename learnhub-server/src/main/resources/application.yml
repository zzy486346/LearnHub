server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: learnhub-server
  datasource:
    url: ${LEARNHUB_DB_URL:jdbc:mysql://localhost:3306/learnhub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${LEARNHUB_DB_USERNAME:learnhub}
    password: ${LEARNHUB_DB_PASSWORD:learnhub}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${LEARNHUB_REDIS_HOST:localhost}
      port: ${LEARNHUB_REDIS_PORT:6379}
  rabbitmq:
    host: ${LEARNHUB_RABBITMQ_HOST:localhost}
    port: ${LEARNHUB_RABBITMQ_PORT:5672}
    username: ${LEARNHUB_RABBITMQ_USERNAME:learnhub}
    password: ${LEARNHUB_RABBITMQ_PASSWORD:learnhub}
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
  elasticsearch:
    uris: ${LEARNHUB_ES_URIS:http://localhost:9200}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${LEARNHUB_MULTIPART_MAX_FILE_SIZE:500MB}
      max-request-size: ${LEARNHUB_MULTIPART_MAX_REQUEST_SIZE:500MB}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted

learnhub:
  storage:
    oss:
      enabled: ${LEARNHUB_OSS_ENABLED:false}
      endpoint: ${LEARNHUB_OSS_ENDPOINT:}
      region: ${LEARNHUB_OSS_REGION:}
      bucket: ${LEARNHUB_OSS_BUCKET:}
      public-base-url: ${LEARNHUB_OSS_PUBLIC_BASE_URL:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      security-token: ${OSS_SESSION_TOKEN:}
      upload-url-ttl: ${LEARNHUB_OSS_UPLOAD_URL_TTL:PT15M}
      download-url-ttl: ${LEARNHUB_OSS_DOWNLOAD_URL_TTL:PT30M}
      max-file-size: ${LEARNHUB_OSS_MAX_FILE_SIZE:524288000}
  rabbit:
    enabled: ${LEARNHUB_MESSAGING_ENABLED:true}
  jwt:
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    private-key-location: ${LEARNHUB_JWT_PRIVATE_KEY_PATH:}
    public-key-location: ${LEARNHUB_JWT_PUBLIC_KEY_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
